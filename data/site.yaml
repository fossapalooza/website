# Everything written on the page comes from this file.
event:
  name: FOSSapalooza
  intro: "One day, multiple stages, the whole software supply chain. FOSSapalooza is an open source conference for everyone who builds, maintains, secures, ships, and uses open source."
  question: Upstream, downstream, all together now.
  date_long: 29 January 2027
  city: Brussels
  venue_name: To be announced
  venue_address: Brussels
  date_note: the day before FOSDEM
  fosdem_dates: 30–31 January 2027
  # OpenStreetMap shown under "Getting there". Delete map_embed (or set it to "") to hide the map.
  map_embed: "https://www.openstreetmap.org/export/embed?bbox=4.337090%2C50.839216%2C4.357090%2C50.849216&layer=mapnik&marker=50.844216%2C4.347090"
  map_link: "https://www.openstreetmap.org/?mlat=50.844216&mlon=4.347090#map=16/50.844216/4.347090"
  # Directions on the OSRM route planner: start left empty for the visitor, hotel as destination, walking (profile=2).
  directions_link: "https://map.project-osrm.org/?z=16&center=50.844216%2C4.347090&loc=&loc=50.844216%2C4.347090&hl=en&profile=2"

nav:
  - { label: Program, href: "#program" }
  - { label: Sponsors, href: "#sponsors" }
  - { label: Venue, href: "#venue" }

# Put logo files in static/images/organizers/ and set "logo" to their path,
# for example: logo: images/organizers/owasp.svg
organizers:
  - { name: AboutCode, url: "https://aboutcode.org", logo: "images/organizers/AboutCode.svg" }
  - { name: OWASP, url: "https://owasp.org/", logo: "images/organizers/OWASP.svg" }
  - { name: Open Regulatory Compliance Working Group, url: "https://orcwg.org/", logo: "images/organizers/ORCWG.svg" }

# Shown in the "With partners" section, below the co-organizers. Same fields as organizers.
partners:
  - { name: OpenChain, url: "https://openchainproject.org/", logo: "images/organizers/OpenChain.svg" }
  
tickets:
  url: "https://register.fossapalooza.eu"
  items:
    - { label: Community, price: Free }
    - { label: "Early-bird · until Dec 30", price: "€100", note: "Your paid registration supports more community tickets!", highlight: true }
    - { label: "Regular", price: "€200", note: "Your paid registration supports more community tickets!" }

cfp:
  show: true
  url: "https://pretalx.com/fossapalooza-2027/"
  heading: ["Got something", "to show us?"]
  text: We want practical talks from people who build, maintain, and ship open source. Submissions go through Pretalx.
  facts:
    - { label: Deadline, value: "Nov 30" }
    - { label: Schedule announced, value: "Dec 7" }
    - { label: Formats, value: "Talks, panels, and more" }

sponsors:
  text: Interested in sponsoring FOSSapalooza? Contact us for more information.

# Co-organizers' events in Brussels around FOSDEM, shown in the "FOSDEM week" section.
# For each event: date, title, organizer, venue, text, and optional url (event page) and register_url.
# Leave url or register_url as "" to hide that button. Delete this whole block to hide the section.
around_fosdem:
  heading: More events
  # The intro can include links, written as [text](https://address).
  intro: "Join us at other events before and after [FOSDEM](https://fosdem.org/)!"
  events:
    - date: Thu 28 January 2027
      title: "Code & Compliance | FOSDEM Edition 2027"
      organizer: Open Regulatory Compliance Working Group (Eclipse Foundation)
      venue: Maison de la Poste, Brussels
      text: "Code & Compliance returns to Brussels for FOSDEM week: a practical day for maintainers and engineers, with implementation detail, working examples and open discussion."
      url: "https://codeandcompliance.orcwg.org/code-compliance-fosdem-edition-2027/"
      register_url: "https://eclipse.idloom.events/code-compliance-jan2027/register"
    - date: Mon 1 February 2027
      title: "FOSDEM 2027 Fringe: FOSS license and security compliance tools workshop"
      organizer: AboutCode
      venue: Brussels
      text: "A one-day workshop for developers and users of open source compliance tools: lightning talks and breakouts for tool developers in the morning, feedback and joint development sessions for tool users in the afternoon."
      url: "https://workshop.aboutcode.org/"
      register_url: "https://workshop.aboutcode.org/"

contact:
  email: "info@fossapalooza.eu"
  coc_url: "https://github.com/fossapalooza/README.md/blob/main/CODE_OF_CONDUCT.md"

legal_entity: "Legal entity: AboutCode Europe ASBL"
